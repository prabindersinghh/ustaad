<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">How USTAAD verifies a factory procedure</title>
  <desc id="desc">Four numbered stages show capture, alignment, ROI comparison, and agent action, followed by a valve correction from fail to pass.</desc>
  <!-- Original USTAAD explanatory figure. Motion approach informed by Anatomy,
       MIT: https://github.com/wheresryan22/anatomy -->
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#fafaf7"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8c9298"/></marker>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <g opacity=".38" stroke="#e9e7df"><path d="M0 80h1200M0 160h1200M0 240h1200M0 320h1200M0 400h1200M0 480h1200M0 560h1200"/><path d="M80 0v650M160 0v650M240 0v650M320 0v650M400 0v650M480 0v650M560 0v650M640 0v650M720 0v650M800 0v650M880 0v650M960 0v650M1040 0v650M1120 0v650"/></g>
  <text x="56" y="48" font-family="monospace" font-size="13" letter-spacing="2" fill="#5b626c">USTAAD / FROM ONE EXPERT TO A VERIFIED WORKER</text>
  <text x="56" y="87" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#111418">The system checks the work, not the worker.</text>
  <g font-family="Arial,sans-serif">
    <rect x="56" y="125" width="250" height="190" rx="16" fill="#fff" stroke="#e1dfd7"/><circle cx="86" cy="157" r="17" fill="#FFC400"/><text x="86" y="163" text-anchor="middle" font-size="15" font-weight="700">1</text><text x="116" y="155" font-size="18" font-weight="700" fill="#111418">Capture once</text><text x="78" y="192" font-size="14" fill="#5b626c">Expert performs the task.</text><rect x="78" y="216" width="112" height="58" rx="7" fill="#2d363d"/><circle cx="103" cy="245" r="11" fill="none" stroke="#FFC400" stroke-width="3"/><circle cx="103" cy="245" r="3" fill="#FFC400"/><path d="M128 232h42M128 244h28M128 256h35" stroke="#aeb7bd" stroke-width="4" stroke-linecap="round"/><text x="202" y="230" font-family="monospace" font-size="11" fill="#5b626c">manual.txt</text><text x="202" y="249" font-family="monospace" font-size="11" fill="#5b626c">keyframe</text><text x="202" y="268" font-family="monospace" font-size="11" fill="#5b626c">ROI</text>
    <rect x="334" y="125" width="250" height="190" rx="16" fill="#fff" stroke="#e1dfd7"/><circle cx="364" cy="157" r="17" fill="#FFC400"/><text x="364" y="163" text-anchor="middle" font-size="15" font-weight="700">2</text><text x="394" y="155" font-size="18" font-weight="700" fill="#111418">Align the view</text><text x="356" y="192" font-size="14" fill="#5b626c">Worker frame → reference.</text><rect x="356" y="216" width="100" height="58" rx="7" fill="#2d363d"/><g fill="none" stroke="#FFC400" stroke-width="2"><rect x="366" y="225" width="16" height="14"/><rect x="430" y="225" width="16" height="14"/><rect x="366" y="251" width="16" height="14"/><rect x="430" y="251" width="16" height="14"/></g><path d="M480 223v44M468 235h24M468 253h24" stroke="#2563EB" stroke-width="2"/><text x="474" y="286" text-anchor="middle" font-family="monospace" font-size="10" fill="#5b626c">ArUco / H</text>
    <rect x="612" y="125" width="250" height="190" rx="16" fill="#fff" stroke="#e1dfd7"/><circle cx="642" cy="157" r="17" fill="#FFC400"/><text x="642" y="163" text-anchor="middle" font-size="15" font-weight="700">3</text><text x="672" y="155" font-size="18" font-weight="700" fill="#111418">Compare the ROI</text><text x="634" y="192" font-size="14" fill="#5b626c">Only the learned region matters.</text><rect x="634" y="216" width="102" height="58" rx="7" fill="#2d363d"/><rect x="650" y="229" width="68" height="26" fill="none" stroke="#DC2626" stroke-width="3"/><path d="M748 228h88M748 242h62M748 256h76" stroke="#5b626c" stroke-width="4" stroke-linecap="round"/><text x="748" y="285" font-family="monospace" font-size="11" fill="#5b626c">CLAHE → SSIM</text>
    <rect x="890" y="125" width="254" height="190" rx="16" fill="#fff" stroke="#e1dfd7"/><circle cx="920" cy="157" r="17" fill="#FFC400"/><text x="920" y="163" text-anchor="middle" font-size="15" font-weight="700">4</text><text x="950" y="155" font-size="18" font-weight="700" fill="#111418">Take an action</text><text x="912" y="192" font-size="14" fill="#5b626c">The agent responds to evidence.</text><rect x="912" y="216" width="88" height="32" rx="16" fill="#fff1f1" stroke="#DC2626"/><circle cx="930" cy="232" r="5" fill="#DC2626"/><text x="942" y="237" font-family="monospace" font-size="11" fill="#DC2626">FAIL</text><path d="M1016 232h56" stroke="#8c9298" stroke-width="2" marker-end="url(#arrow)"/><rect x="1080" y="216" width="48" height="32" rx="16" fill="#effaf1" stroke="#16A34A"/><text x="1104" y="237" text-anchor="middle" font-family="monospace" font-size="10" fill="#16A34A">PASS</text><text x="912" y="278" font-family="monospace" font-size="11" fill="#5b626c">flag_error → re-check</text>
  </g>
  <path d="M306 220h22M584 220h22M862 220h22" stroke="#8c9298" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="56" y="360" width="1088" height="236" rx="16" fill="#111418"/>
  <text x="82" y="397" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#aeb7bd">CONCRETE EXAMPLE / STEP 03 / FEED VALVE</text><text x="82" y="432" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Wrong state → localised feedback → corrected state</text>
  <g font-family="Arial,sans-serif"><rect x="82" y="460" width="260" height="92" rx="10" fill="#252c31" stroke="#DC2626"/><text x="102" y="487" font-size="14" font-weight="700" fill="#ffb4b4">BEFORE / FAIL</text><text x="102" y="516" font-size="14" fill="#cbd0d2">Valve closed</text><text x="102" y="538" font-family="monospace" font-size="12" fill="#DC2626">SSIM = 0.31 · ROI: valve</text><path d="M378 506h120" stroke="#FFC400" stroke-width="2" marker-end="url(#arrow)"/><text x="388" y="490" font-family="monospace" font-size="11" fill="#FFC400">flag_error</text><text x="388" y="528" font-family="monospace" font-size="11" fill="#FFC400">human-visible reason</text><rect x="550" y="460" width="260" height="92" rx="10" fill="#252c31" stroke="#16A34A"/><text x="570" y="487" font-size="14" font-weight="700" fill="#b9efc2">AFTER / PASS</text><text x="570" y="516" font-size="14" fill="#cbd0d2">Valve open</text><text x="570" y="538" font-family="monospace" font-size="12" fill="#16A34A">SSIM = 0.91 · next_step</text><text x="866" y="487" font-family="monospace" font-size="12" fill="#aeb7bd">No surveillance</text><text x="866" y="511" font-family="monospace" font-size="12" fill="#aeb7bd">No silent guesses</text><text x="866" y="535" font-family="monospace" font-size="12" fill="#FFC400">Human escalation if unsure</text></g>
  <circle cx="1110" cy="88" r="7" fill="#FFC400"><animate attributeName="cx" values="1110;1130;1110" dur="2s" repeatCount="indefinite"/></circle>
</svg>
